[tox]
requires = tox>=4
env_list = py310, py311, py312, py313, py314

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
runner = uv-venv-lock-runner
pass_env = RELAY_TEST_NODE_20, RELAY_TEST_NODE_24, RELAY_TEST_WORKERS, RELAY_TEST_REPORT_DIR, CI, GITHUB_SHA, GITHUB_STEP_SUMMARY, RUNNER_TEMP
commands =
    python scripts/run_python_tests.py --reports-dir "{env:RELAY_TEST_REPORT_DIR:{env_tmp_dir}/reports}" --legacy-coverage
