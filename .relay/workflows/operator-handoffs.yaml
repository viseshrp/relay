version: 1
name: Relay operator handoff integration
inputs:
  task:
    type: string
    required: true
nodes:
  plan:
    type: agent
    writes: true
    allow_no_commit: true
    agents: [claude]
    model: opus
    permission_profile: interactive
    prompts: []
    outputs:
      planning_ready:
        label:
          artifact: OPERATOR_HANDOFF_PLAN.md
          label: Planning ready for owner review
  owner_decision:
    type: human_wait
    needs: [plan]
    prompt: Review the retained OPERATOR_HANDOFF_PLAN.md and approve its concrete scope before implementation. Preserve actual human review and security decisions.
