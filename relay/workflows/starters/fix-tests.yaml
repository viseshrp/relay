name: Fix until tests pass
on:
  workflow_dispatch:
    inputs:
      task:
        description: Which failing tests or change should the agent fix?
        required: true
        default: Run the tests and fix the failures without changing their
          intent.
        type: string
jobs:
  main:
    runs-on: self-hosted
    steps:
    - uses: relay/agent@v1
      with:
        agents: '["codex", "claude", "copilot", "cursor", "antigravity"]'
        prompt-files: prompts/implement.md
        prompt: ${{ inputs.task }}
    - uses: relay/command@v1
      with: &id001
        argv: '["python", "-m", "pytest"]'
      continue-on-error: true
      id: test
    - uses: relay/agent@v1
      with:
        agents: '["codex", "claude", "copilot", "cursor", "antigravity"]'
        prompt-files: prompts/fix-tests.md
        prompt: ${{ inputs.task }}
      if: steps.test.outcome == 'failure'
    - uses: relay/command@v1
      with: *id001
      continue-on-error: true
      id: verify
      if: steps.test.outcome == 'failure'
    - uses: relay/agent@v1
      with:
        agents: '["codex", "claude", "copilot", "cursor", "antigravity"]'
        prompt-files: prompts/fix-tests.md
        prompt: ${{ inputs.task }}
      if: steps.verify.outcome == 'failure'
    - uses: relay/command@v1
      with:
        argv: '["python", "-m", "pytest"]'
      if: steps.verify.outcome == 'failure'
