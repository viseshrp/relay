name: Branch review and fix cycle
on:
  workflow_call:
    inputs:
      agent: {type: string, required: true}
      model: {type: string, required: true}
      opus_model: {type: string, required: true}
    outputs:
      ready:
        value: ${{ jobs.cycle.outputs.ready }}

jobs:
  cycle:
    outputs:
      ready: ${{ steps.verify.outputs.value }}
    steps:
      - uses: relay/agent@v1
        with:
          agent: claude
          model: ${{ inputs.opus_model }}
          prompt-files: prompts/ai-coding-workflow/04_opus_review_branch.md
      - id: instruction
        uses: ./.relay/actions/ai-coding-workflow/read-generated-prompt
        with:
          file: REVIEW_FIX_PROMPT.md
      - uses: relay/agent@v1
        with:
          agent: ${{ inputs.agent }}
          model: ${{ inputs.model }}
          prompt: ${{ steps.instruction.outputs.prompt }}
      - id: verify
        uses: relay/agent@v1
        with:
          agent: claude
          model: ${{ inputs.opus_model }}
          prompt-files: >-
            prompts/ai-coding-workflow/05_opus_verify_review_fixes.md
          report: REVIEW_FIX_VERIFICATION.md
          format: label
          label: '- Ready to finalize review/walkthrough docs'
