name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.14"
  uv-version:
    description: "uv version to use"
    required: false
    default: "latest"
  managed-python:
    description: "Install the requested Python through uv instead of setup-python"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      if: inputs.managed-python != 'true'
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true
        cache-suffix: ${{ github.job }}-${{ inputs.python-version }}
        prune-cache: true
        python-version: ${{ inputs.managed-python == 'true' && inputs.python-version || '' }}

    - name: Get resolved Python version
      id: resolved-python
      shell: bash
      run: |
        PYTHON_VERSION=$(uv run --no-project python -c "import sys; print('{}.{}.{}'.format(*sys.version_info[:3]))")
        echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache .venv directory
      uses: actions/cache@v6.1.0
      with:
        path: .venv
        key: uv-venv-${{ runner.os }}-${{ steps.resolved-python.outputs.version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          uv-venv-${{ runner.os }}-${{ steps.resolved-python.outputs.version }}-

    - name: Disable pip version check (optional)
      run: echo "PIP_DISABLE_PIP_VERSION_CHECK=1" >> $GITHUB_ENV
      shell: bash

    - name: Install Python dependencies
      run: make install
      shell: bash

    - name: Add .venv to PATH (cross-platform)
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "$(pwd)/.venv/Scripts" >> $GITHUB_PATH
        else
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH
        fi
      shell: bash
