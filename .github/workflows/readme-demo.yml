name: README demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - frontend/src/**
      - frontend/scripts/**
      - frontend/e2e/readme.demo.ts
      - frontend/e2e/setup-helpers.ts
      - frontend/playwright*.ts
      - frontend/package*.json
      - frontend/vite.config.ts
      - relay/**
      - tests/e2e_server.py
      - tests/fake_agent.py
      - tests/support.py
      - pyproject.toml
      - uv.lock
      - .github/workflows/readme-demo.yml
  pull_request:
    paths:
      - frontend/e2e/readme.demo.ts
      - frontend/scripts/render-demo.mjs
      - frontend/playwright.demo.config.ts
      - .github/workflows/readme-demo.yml

permissions:
  contents: read

concurrency:
  group: readme-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: ./.github/actions/setup-python-env

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install capture tools
        run: |
          npm --prefix frontend ci
          npm --prefix frontend exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Generate and validate the browser walkthrough
        run: npm --prefix frontend run demo

      - name: Retain the GIF and capture diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: readme-demo
          path: |
            docs/images/demo.gif
            frontend/test-results/readme-demo/
          retention-days: 7

      - name: Propose the updated GIF
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          base: main
          branch: chore/readme-demo-update
          add-paths: docs/images/demo.gif
          title: "docs: refresh the README walkthrough"
          commit-message: "docs: refresh the README walkthrough"
          body: |
            Regenerated from the current browser UI with Playwright and FFmpeg.

            The capture exercises workflow authoring, agent settings, launch,
            an owner approval, job output, and retained artifact previews in a
            disposable repository with deterministic test agents.

            Review the GIF and the `readme-demo` workflow artifact before merging.
          delete-branch: true
