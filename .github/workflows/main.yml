name: Main

on:
  workflow_dispatch:
    inputs:
      refresh_visual_baselines:
        description: Generate Linux visual baselines for review
        type: boolean
        default: false
  pull_request:
  push:
    tags:
      - "v*"
    branches:
      - main
      - release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_PYTHON_VERSION: '3.14'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Cache pre-commit hooks
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Node for frontend quality checks
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run code quality checks
        run: make check

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node 20 for local action tests
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Capture Node 20 runtime
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          executable = shutil.which("node")
          assert executable is not None
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"RELAY_TEST_NODE_20={executable}\n")
          PY

      - name: Set up Node 24 for local action tests
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'

      - name: Capture Node 24 runtime
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          executable = shutil.which("node")
          assert executable is not None
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"RELAY_TEST_NODE_24={executable}\n")
          PY

      - name: Validate Windows command and payload boundaries
        if: runner.os == 'Windows'
        run: >-
          uv run pytest tests/test_windows_process.py
          tests/test_workflow_starters.py
          tests/test_actions_language_boundaries.py -q

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == env.MAIN_PYTHON_VERSION && matrix.os == 'ubuntu-latest' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Node for browser tests
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate Linux visual baselines for review
        if: inputs.refresh_visual_baselines == true
        run: |
          npm --prefix frontend run build
          cd frontend
          npx playwright test --config playwright.visual.config.ts --update-snapshots --grep '^visual '

      - name: Retain generated Linux visual baselines
        if: inputs.refresh_visual_baselines == true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-visual-baselines
          path: frontend/e2e/baselines/linux/
          if-no-files-found: error
          retention-days: 7

      - name: Run browser tests against the isolated Relay server
        run: make test-frontend

      - name: Retain failed browser traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-traces
          path: frontend/test-results/
          retention-days: 7

  publish-to-testpypi:
    if: github.ref == 'refs/heads/main'
    needs: [ quality, tests, browser-tests ]
    runs-on: ubuntu-latest
    environment:
      name: test-pypi
    permissions:
      contents: read
    env:
      TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Node for frontend build
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run version checks
        run: make check-dev-version

      - name: Build project
        run: make build

      - name: Check dist
        run: make check-dist

      - name: Retain verified distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish to TestPyPI
        if: env.TEST_PYPI_TOKEN != ''
        run: make publish-test

      - name: Report unconfigured TestPyPI publication
        if: env.TEST_PYPI_TOKEN == ''
        run: |
          echo "::notice::TestPyPI upload skipped: TEST_PYPI_TOKEN is not configured."
          echo "Verified distributions are retained; TestPyPI upload was skipped because TEST_PYPI_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"

  create-draft-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [ quality, tests, browser-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Node for frontend build
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release tag matches package version
        run: make check-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Build and verify release artifacts
        run: |
          make build
          make check-dist

      - name: Create draft GitHub release with verified artifacts
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Release $RELEASE_TAG" \
            --notes-from-tag \
            --draft \
            --verify-tag \
            dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
