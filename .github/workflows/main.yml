name: Main

on:
  workflow_dispatch:
    inputs:
      refresh_visual_baselines:
        description: Generate Linux visual baselines for review
        type: boolean
        default: false
      serial_python:
        description: Run complete serial Python references
        type: boolean
        default: false
      cold_cache:
        description: Skip dependency cache restoration and saving
        type: boolean
        default: false
  pull_request:
  push:
    tags:
      - "v*"
    branches:
      - main
      - release/*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_PYTHON_VERSION: '3.14'

jobs:
  quality:
    if: inputs.refresh_visual_baselines != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Cache pre-commit hooks
        if: inputs.cold_cache != true
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env
        with:
          cache-enabled: ${{ inputs.cold_cache != true }}

      - name: Set up Node for frontend quality checks
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: ${{ inputs.cold_cache != true && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run code quality checks
        run: make check


  tests:
    if: inputs.refresh_visual_baselines != true
    runs-on: ${{ matrix.os }}
    env:
      # Keep tox on the same managed patch release as the Windows 3.10 job.
      UV_PYTHON_PREFERENCE: ${{ matrix.os == 'windows-latest' && matrix.python-version == '3.10' && 'only-managed' || 'system' }}
      RELAY_TEST_WORKERS: ${{ inputs.serial_python == true && '0' || (matrix.os == 'macos-latest' && '2' || '3') }}
      RELAY_TEST_COVERAGE: ${{ matrix.python-version == '3.14' && matrix.os != 'macos-latest' && 'true' || 'false' }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python and both JavaScript action runtimes
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}
          cache-enabled: ${{ inputs.cold_cache != true }}

      - name: Run complete Python suite and verify execution
        run: make test

      - name: Retain Python outcomes, coverage, and timings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-results-${{ matrix.os }}-${{ matrix.python-version }}
          include-hidden-files: true
          path: ${{ runner.temp }}/rp/reports/
          if-no-files-found: error
          retention-days: 1

      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == env.MAIN_PYTHON_VERSION && matrix.os != 'macos-latest' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ runner.temp }}/rp/reports/coverage.xml
          disable_search: true
          fail_ci_if_error: true

  frontend-prepare:
    if: inputs.refresh_visual_baselines != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env
        with:
          cache-enabled: ${{ inputs.cold_cache != true }}

      - name: Set up Node for browser tests
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: ${{ inputs.cold_cache != true && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Chromium for real build-publication tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run all frontend build-script and expression tests
        run: npm --prefix frontend run test:build

      - name: Collect complete browser and unit inventories
        run: >-
          node frontend/scripts/verify-browser.mjs inventory
          "$RUNNER_TEMP/frontend-preparation/inventory.json"

      - name: Identify the actual browser checkout
        run: echo "RELAY_TEST_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run and retain all frontend unit tests
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/frontend-preparation/results/unit/unit/report.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/frontend-preparation/results/unit/unit/blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-unit.zip
        run: >-
          npx playwright test --config playwright.unit.config.ts
          --workers=1 --retries=0 --forbid-only --update-snapshots=none
          --reporter=line,json,blob

      - name: Check types and build browser assets once
        run: npm --prefix frontend run build

      - name: Archive and identify the exact browser build
        run: |
          test -f relay/static/index.html
          test -z "$(find relay/static -mindepth 1 ! -type f ! -type d -print -quit)"
          git rev-parse HEAD > "$RUNNER_TEMP/frontend-preparation/assets.commit"
          tar -C relay/static -czf "$RUNNER_TEMP/frontend-preparation/assets.tgz" .
          cd "$RUNNER_TEMP/frontend-preparation"
          sha256sum assets.tgz > assets.sha256

      - name: Retain browser inputs and frontend unit results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend-preparation
          path: ${{ runner.temp }}/frontend-preparation/
          if-no-files-found: error
          retention-days: 1

  browser-shards:
    if: inputs.refresh_visual_baselines != true
    needs: frontend-prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env
        with:
          cache-enabled: ${{ inputs.cold_cache != true }}

      - name: Set up Node for browser tests
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: ${{ inputs.cold_cache != true && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install isolated browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Download the prepared browser build and inventory
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-preparation
          path: ${{ runner.temp }}/frontend-preparation

      - name: Configure isolated browser assets
        run: echo "RELAY_TEST_ASSETS_ROOT=$RUNNER_TEMP/browser-assets" >> "$GITHUB_ENV"

      - name: Verify browser build bytes and checkout identity
        id: assets
        run: |
          test "$(cat "$RUNNER_TEMP/frontend-preparation/assets.commit")" = "$(git rev-parse HEAD)"
          echo "RELAY_TEST_CHECKOUT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          (cd "$RUNNER_TEMP/frontend-preparation" && sha256sum --check assets.sha256)
          mkdir -p "$RELAY_TEST_ASSETS_ROOT"
          tar -xzf "$RUNNER_TEMP/frontend-preparation/assets.tgz" -C "$RELAY_TEST_ASSETS_ROOT"

      - name: Run functional browser shard
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/browser-results/shard-${{ matrix.shard }}/functional/report.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/browser-results/shard-${{ matrix.shard }}/functional/blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-functional-${{ matrix.shard }}.zip
        run: >-
          npx playwright test --config playwright.config.ts
          --shard=${{ matrix.shard }}/4 --workers=1 --retries=0
          --forbid-only --update-snapshots=none --reporter=line,json,blob
          --output "$RUNNER_TEMP/browser-results/shard-${{ matrix.shard }}/functional/test-results"

      - name: Run complete no-login suite
        if: ${{ always() && matrix.shard == 4 && steps.assets.outcome == 'success' }}
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/browser-results/shard-4/no-login/report.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/browser-results/shard-4/no-login/blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-no-login.zip
        run: >-
          npx playwright test --config playwright.no-login.config.ts
          --workers=1 --retries=0 --forbid-only --update-snapshots=none
          --reporter=line,json,blob
          --output "$RUNNER_TEMP/browser-results/shard-4/no-login/test-results"

      - name: Run complete visual suite
        if: ${{ always() && matrix.shard == 4 && steps.assets.outcome == 'success' }}
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/browser-results/shard-4/visual/report.json
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ runner.temp }}/browser-results/shard-4/visual/blob
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-visual.zip
        run: >-
          npx playwright test --config playwright.visual.config.ts
          --workers=1 --retries=0 --forbid-only --update-snapshots=none
          --reporter=line,json,blob
          --output "$RUNNER_TEMP/browser-results/shard-4/visual/test-results"

      - name: Retain browser outcomes and reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-results-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-results/
          if-no-files-found: error
          retention-days: 1

      - name: Retain failed browser traces and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-traces-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-results/**/test-results/
          retention-days: 7

  browser-tests:
    if: ${{ always() && inputs.refresh_visual_baselines != true }}
    needs: [frontend-prepare, browser-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node for report verification
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: ${{ inputs.cold_cache != true && 'npm' || '' }}
          cache-dependency-path: frontend/package-lock.json

      - name: Install report tools
        run: npm --prefix frontend ci

      - name: Download preparation and frontend unit results
        uses: actions/download-artifact@v8.0.2
        with:
          name: frontend-preparation
          path: ${{ runner.temp }}/frontend-preparation

      - name: Download every browser shard report
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: browser-results-*
          path: ${{ runner.temp }}/browser-results
          merge-multiple: true

      - name: Verify complete execution and collect mergeable reports
        run: |
          cp -R "$RUNNER_TEMP/frontend-preparation/results/unit" "$RUNNER_TEMP/browser-results/unit"
          node frontend/scripts/verify-browser.mjs verify \
            "$RUNNER_TEMP/browser-results" \
            "$RUNNER_TEMP/frontend-preparation/inventory.json" \
            "$RUNNER_TEMP/merged-blobs"

      - name: Merge complete browser reports
        if: always()
        working-directory: frontend
        run: npx playwright merge-reports --reporter=html "$RUNNER_TEMP/merged-blobs"

      - name: Retain merged browser report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-report
          path: |
            frontend/playwright-report/
            ${{ runner.temp }}/browser-results/browser-summary.json
          retention-days: 1

      - name: Require every upstream browser job to succeed
        if: always()
        env:
          PREPARATION_RESULT: ${{ needs.frontend-prepare.result }}
          SHARD_RESULT: ${{ needs.browser-shards.result }}
        run: |
          test "$PREPARATION_RESULT" = success
          test "$SHARD_RESULT" = success

  visual-baselines:
    if: inputs.refresh_visual_baselines == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Node for browser tests
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate Linux visual baselines for review
        run: |
          npm --prefix frontend run build
          cd frontend
          npx playwright test --config playwright.visual.config.ts --update-snapshots=all --grep 'visual .* at'

      - name: Retain generated Linux visual baselines
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-visual-baselines
          path: frontend/e2e/baselines/linux/
          if-no-files-found: error
          retention-days: 7

      - name: Run complete browser verification
        run: make test-frontend

      - name: Retain failed browser traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-traces
          path: frontend/test-results/
          retention-days: 7

  publish-to-testpypi:
    if: github.ref == 'refs/heads/main'
    needs: [ quality, tests, browser-tests ]
    runs-on: ubuntu-latest
    environment:
      name: test-pypi
    permissions:
      contents: read
    env:
      TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Node for frontend build
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run version checks
        run: make check-dev-version

      - name: Build project
        run: make build

      - name: Check dist
        run: make check-dist

      - name: Retain verified distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish to TestPyPI
        if: env.TEST_PYPI_TOKEN != ''
        run: make publish-test

      - name: Report unconfigured TestPyPI publication
        if: env.TEST_PYPI_TOKEN == ''
        run: |
          echo "::notice::TestPyPI upload skipped: TEST_PYPI_TOKEN is not configured."
          echo "Verified distributions are retained; TestPyPI upload was skipped because TEST_PYPI_TOKEN is not configured." >> "$GITHUB_STEP_SUMMARY"

  create-draft-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [ quality, tests, browser-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Node for frontend build
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify release tag matches package version
        run: make check-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Build and verify release artifacts
        run: |
          make build
          make check-dist

      - name: Create draft GitHub release with verified artifacts
        run: |
          gh release create "$RELEASE_TAG" \
            --title "Release $RELEASE_TAG" \
            --notes-from-tag \
            --draft \
            --verify-tag \
            dist/*
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
