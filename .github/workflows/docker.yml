name: Container

on:
  schedule:
    # Off the hour to avoid the busiest scheduler window; always UTC.
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: container-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/viseshrp/relay

jobs:
  prepare:
    if: >-
      github.repository == 'viseshrp/relay' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.metadata.outputs.revision }}
      version: ${{ steps.metadata.outputs.version }}
      tags: ${{ steps.metadata.outputs.tags }}
      primary_tag: ${{ steps.metadata.outputs.primary_tag }}
      created: ${{ steps.metadata.outputs.created }}
      mode: ${{ steps.metadata.outputs.mode }}
    steps:
      - name: Check out target ref
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Resolve version and image tags
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [[ "$EVENT_NAME" == "release" || "$REF" == refs/tags/v* ]]; then
            release_tag="${RELEASE_TAG_NAME:-$REF_NAME}"
            make check-version RELEASE_TAG="$release_tag"
            version="$(uv run hatch version)"
            tags="$release_tag $version"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              tags="$tags latest"
            fi
            primary_tag="$release_tag"
            mode="release"
          else
            make check-dev-version
            stamp="$(date -u +%Y%m%d)"
            raw_version="$(uv run hatch version)"
            base_version="${raw_version%%.dev*}"
            version="${base_version}.dev${stamp}${GITHUB_RUN_NUMBER}${GITHUB_RUN_ATTEMPT}"
            build_tag="nightly-${stamp}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            tags="nightly ${build_tag}"
            primary_tag="nightly"
            mode="nightly"
          fi

          {
            echo "revision=$revision"
            echo "version=$version"
            echo "tags=$tags"
            echo "primary_tag=$primary_tag"
            echo "created=$created"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and smoke test (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            machine: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            machine: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          no-cache: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ needs.prepare.outputs.revision }}
          labels: |
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test the published platform image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.machine }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(docker run --rm "$IMAGE@$DIGEST" --version)"
          test "$actual_version" = "relay, version $EXPECTED_VERSION"
          docker run --rm "$IMAGE@$DIGEST" --help >/dev/null
          actual_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE@$DIGEST")"
          test "$actual_revision" = "$EXPECTED_REVISION"
          label_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE@$DIGEST")"
          test "$label_version" = "$EXPECTED_VERSION"
          actual_user="$(docker image inspect --format '{{ .Config.User }}' "$IMAGE@$DIGEST")"
          test "$actual_user" = "relay:relay"
          docker run --rm --entrypoint /bin/sh "$IMAGE@$DIGEST" -ec '
            test "$(id -u)" -ne 0
            test "$(uname -m)" = "$1"
            command -v git >/dev/null
            command -v ps >/dev/null
            ! command -v node >/dev/null 2>&1
            ! command -v npm >/dev/null 2>&1
            repo="$(mktemp -d)"
            cd "$repo"
            git init -q
            git config user.name "Relay Container Smoke"
            git config user.email "smoke@example.invalid"
            git commit --allow-empty -q -m "initial"
            relay init >/dev/null
            test -f .relay/workflows/workflow.yaml
            relay up --no-browser --no-login >"$repo/up.log" 2>&1 &
            up_pid="$!"
            python - <<PY
          import time
          import urllib.request

          deadline = time.monotonic() + 20.0
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen("http://127.0.0.1:7845/api/auth", timeout=1.0) as auth:
                      if auth.status == 200:
                          break
              except Exception:
                  time.sleep(0.1)
          else:
              raise SystemExit("Relay web API did not become ready in container smoke test")

          with urllib.request.urlopen("http://127.0.0.1:7845/", timeout=2.0) as root:
              body = root.read().decode("utf-8")
              assert root.status == 200
              assert "<div id=\"root\"></div>" in body
          PY
            kill -TERM "$up_pid"
            wait "$up_pid"
            grep -F "Relay stopped cleanly." "$repo/up.log" >/dev/null
          ' sh "$EXPECTED_ARCH"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Export the verified platform digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish container manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified platform digests
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tags after both platforms pass
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          PRIMARY_TAG: ${{ needs.prepare.outputs.primary_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          MODE: ${{ needs.prepare.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest")")
          done
          test "${#sources[@]}" -eq 2

          tag_args=()
          published_refs=()
          for tag in $TAGS; do
            tag_args+=(--tag "$IMAGE:$tag")
            published_refs+=("$IMAGE:$tag")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$PRIMARY_TAG" --raw > "$RUNNER_TEMP/manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            "$RUNNER_TEMP/manifest.json"

          {
            echo "Mode: $MODE"
            echo "Version: $VERSION"
            echo "Source revision: $REVISION"
            echo "Platforms: linux/amd64, linux/arm64"
            echo "Tags:"
            for ref in "${published_refs[@]}"; do
              echo "- $ref"
            done
          } >> "$GITHUB_STEP_SUMMARY"
