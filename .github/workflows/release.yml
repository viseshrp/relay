name: Release

on:
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Cache pre-commit hooks
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Set up Node for frontend quality checks
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run code quality checks
        run: make check

  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    defaults:
      run:
        shell: bash
    env:
      RELAY_TEST_WORKERS: ${{ matrix.os == 'macos-latest' && '2' || '3' }}
      RELAY_TEST_COVERAGE: ${{ matrix.python-version == '3.14' && matrix.os != 'macos-latest' && 'true' || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Set up Python and both JavaScript action runtimes
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: make test

      - name: Retain Python outcomes, coverage, and timings
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-python-results-${{ matrix.os }}-${{ matrix.python-version }}
          include-hidden-files: true
          path: ${{ runner.temp }}/rp/reports/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [ quality, tests ]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0  # Required for hatch-vcs to generate full version
          fetch-tags: true

      - name: Set up Python + Environment
        uses: ./.github/actions/setup-python-env

      - name: Verify release tag matches package version
        run: make check-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Download artifacts verified by the tag workflow
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" \
            --pattern '*.whl' \
            --pattern '*.tar.gz' \
            --dir dist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Recheck downloaded artifacts
        run: make check-dist

      - name: Publish verified artifacts to PyPI
        run: make publish
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
