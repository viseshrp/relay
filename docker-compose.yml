services:
  relay:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - relay-data:/data
      - ${HOME}/.config/gh:/root/.config/gh:ro
      - /path/to/projects:/projects
    environment:
      - RELAY_DATA_DIR=/data
      - RELAY_HOST=0.0.0.0
      - RELAY_PORT=8080
    command: ["dev"]

volumes:
  relay-data:
